name: Validate jucs 142
on:
  push:
    branches: [validate-142-20261112]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      matrix:
        os: [ubuntu-24.04]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 526b05a9a139b4d381ccf34433d79ca9afb1ca3a
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prove the focused regression on the original implementation
        run: |
          set -eu
          git checkout 1e4f5027b59f4a0e7c156b3d26f733b7262345fe -- src/main/java/org/eolang/jucs/JucsProvider.java
          if mvn --errors --batch-mode -Dtest=JucsProviderRecursiveTest test > baseline.log 2>&1; then
            cat baseline.log
            echo 'The original implementation unexpectedly passed'
            exit 1
          fi
          grep -E 'Tests run:.*(Failures: [1-9]|Errors: [1-9])' baseline.log
          git checkout HEAD -- src/main/java/org/eolang/jucs/JucsProvider.java
      - name: Run complete verification on the candidate
        run: mvn --errors --batch-mode clean install -Pqulice
